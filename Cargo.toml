[package]
name = "liubendou"
version = "0.1.0"
edition = "2021"
description = "六本豆 Agent — 授权范围内的自动化安全测试 Agent"
license = "Apache-2.0"
default-run = "liubendou"

[[bin]]
name = "liubendou"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
tiny_http = "0.12"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
